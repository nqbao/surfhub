[metadata]
name = surfhub
version = 0.0.7
author = Bao Nguyen
author_email = qbao.nguyen@gmail.com
description = A Python library for SERP and web scraping with multiple provider integration
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/nqbao/surfhub
project_urls =
    Bug Tracker = https://github.com/nqbao/surfhub/issues
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
keywords = serp, scraping, web, browserless, zyte

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.11.5
install_requires =
    anyio>=4
    beautifulsoup4>=4.9.3
    httpcore>=1,<2
    httpx>=0.27.2
    pydantic>=1.10.13
    sniffio>=1.3
    soupsieve>=4.0.0
    trafilatura>=1.12

[options.extras_require]
test =
    respx
    pyyaml
browser =
    playwright>=1.40

[options.packages.find]
where = src
